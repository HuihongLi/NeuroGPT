# Config for the SpikeGPT neural-data-analysis study (216M pile model, RNN inference path).
# Mirrors the model fields in run.py so capture reproduces that forward pass exactly.

# --- model (must match the checkpoint) ---
model_name: model/SpikeGPT-216M
n_layer: 18
n_embd: 768
ctx_len: 1024
vocab_size: 50277
run_device: cpu        # cpu + fp32 works and is reasonably fast (see CLAUDE.md)
float_mode: fp32

# --- tokenizer ---
token_mode: pile       # 'pile' (20B tokenizer) or 'char' (vocab_book, vocab_size 77)
word_name:
  - data/20B_tokenizer.json
  - data/20B_tokenizer.json
unknown_char: null

# --- analysis ---
branch: attn           # 'attn' (mem1) or 'ffn' (mem2)
target: is_content     # decoding target: is_content | pos_tag | position | token_id
out_dir: neuro_analysis/outputs

# Which activity regimes to capture/analyze:
#   driven      = teacher-forced on real text (DEFAULT_STIMULI)  -> evoked activity
#   spontaneous = model self-rollout from prompts (DEFAULT_PROMPTS) -> spontaneous activity
conditions:
  driven: true
  spontaneous: true

# Optional external corpora (one item per line). If null, use datasets.DEFAULT_STIMULI /
# DEFAULT_PROMPTS. Point these at bigger files to scale token counts without editing code.
stimuli_file: null
prompts_file: null

rollout:                # settings for the spontaneous condition
  n_generate: 128       # tokens generated per prompt (fixed sequence length; longer = more data)
  temperature: 0.8
  top_p: 0.7

stages:
  capture: true         # forward passes -> responses_{driven,spont}.npz (slow; do once)
  compare: true         # per-condition geometry + decoding battery (H1-H4)
  contrast: true        # driven-vs-spontaneous contrast (needs both conditions)
